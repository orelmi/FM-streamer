{% extends "base.html" %}

{% block title %}Podcasts - DAB+ Podcast Streamer{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="bi bi-mic"></i> Gestion des Podcasts</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPodcastModal">
                <i class="bi bi-plus-lg"></i> Ajouter un podcast
            </button>
        </div>
        <hr>
    </div>
</div>

<!-- Podcasts List -->
<div class="row" id="podcasts-container">
    <div class="col-12">
        <div class="alert alert-info">Chargement des podcasts...</div>
    </div>
</div>

<!-- Add Podcast Modal -->
<div class="modal fade" id="addPodcastModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-lg"></i> Ajouter un podcast</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="add-podcast-form">
                    <div class="mb-3">
                        <label for="feed-url" class="form-label">URL du flux RSS</label>
                        <input type="url" class="form-control" id="feed-url" required
                               placeholder="https://example.com/podcast/feed.xml">
                        <div class="form-text">Entrez l'URL du flux RSS du podcast</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" onclick="addPodcast()">
                    <i class="bi bi-plus-lg"></i> Ajouter
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Podcast Details Modal -->
<div class="modal fade" id="podcastDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="podcast-detail-title">Podcast</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="podcast-detail-content">
                Chargement...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let podcasts = [];

async function loadPodcasts() {
    try {
        const res = await fetch('/api/podcasts');
        const data = await res.json();

        if (data.success) {
            podcasts = data.podcasts;
            renderPodcasts();
        }
    } catch (error) {
        console.error('Error loading podcasts:', error);
        document.getElementById('podcasts-container').innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">Erreur lors du chargement des podcasts</div>
            </div>
        `;
    }
}

function renderPodcasts() {
    const container = document.getElementById('podcasts-container');

    if (podcasts.length === 0) {
        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Aucun podcast. Ajoutez votre premier podcast!
                </div>
            </div>
        `;
        return;
    }

    container.innerHTML = podcasts.map(podcast => `
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">${podcast.title}</h5>
                    <p class="card-text text-muted">${podcast.author || 'Auteur inconnu'}</p>
                    <p class="card-text small">${podcast.description.substring(0, 100)}...</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-primary">${podcast.episodes.length} épisodes</span>
                        <span class="badge bg-success">${podcast.episodes.filter(e => e.downloaded).length} téléchargés</span>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="btn-group w-100" role="group">
                        <button class="btn btn-outline-primary btn-sm" onclick="showPodcastDetails('${podcast.id}')">
                            <i class="bi bi-eye"></i> Voir
                        </button>
                        <button class="btn btn-outline-success btn-sm" onclick="refreshPodcast('${podcast.id}')">
                            <i class="bi bi-arrow-clockwise"></i> Rafraîchir
                        </button>
                        <button class="btn btn-outline-danger btn-sm" onclick="deletePodcast('${podcast.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

async function addPodcast() {
    const feedUrl = document.getElementById('feed-url').value;

    if (!feedUrl) {
        alert('Veuillez entrer une URL de flux RSS');
        return;
    }

    try {
        const res = await fetch('/api/podcasts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feed_url: feedUrl })
        });

        const data = await res.json();

        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('addPodcastModal')).hide();
            document.getElementById('feed-url').value = '';
            loadPodcasts();
        } else {
            alert('Erreur: ' + data.error);
        }
    } catch (error) {
        console.error('Error adding podcast:', error);
        alert('Erreur lors de l\'ajout du podcast');
    }
}

async function showPodcastDetails(podcastId) {
    const podcast = podcasts.find(p => p.id === podcastId);
    if (!podcast) return;

    document.getElementById('podcast-detail-title').textContent = podcast.title;

    const content = `
        <div class="row">
            <div class="col-md-4">
                <p><strong>Auteur:</strong> ${podcast.author || 'Inconnu'}</p>
                <p><strong>Langue:</strong> ${podcast.language}</p>
                <p><strong>Site:</strong> <a href="${podcast.website}" target="_blank">${podcast.website || '-'}</a></p>
            </div>
            <div class="col-md-8">
                <p>${podcast.description}</p>
            </div>
        </div>
        <hr>
        <h5>Episodes (${podcast.episodes.length})</h5>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Durée</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${podcast.episodes.map(ep => `
                        <tr>
                            <td>${ep.title.substring(0, 50)}</td>
                            <td>${formatDuration(ep.duration)}</td>
                            <td>${new Date(ep.published).toLocaleDateString('fr-FR')}</td>
                            <td>
                                ${ep.downloaded
                                    ? '<span class="badge bg-success">Téléchargé</span>'
                                    : '<span class="badge bg-secondary">Non téléchargé</span>'}
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    ${!ep.downloaded ? `
                                        <button class="btn btn-outline-primary" onclick="downloadEpisode('${podcast.id}', '${ep.id}')">
                                            <i class="bi bi-download"></i>
                                        </button>
                                    ` : ''}
                                    <button class="btn btn-outline-success" onclick="addToPlaylist('${podcast.id}', '${ep.id}')">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;

    document.getElementById('podcast-detail-content').innerHTML = content;
    new bootstrap.Modal(document.getElementById('podcastDetailsModal')).show();
}

async function refreshPodcast(podcastId) {
    try {
        const res = await fetch(`/api/podcasts/${podcastId}/refresh`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
            loadPodcasts();
        } else {
            alert('Erreur: ' + data.error);
        }
    } catch (error) {
        console.error('Error refreshing podcast:', error);
    }
}

async function deletePodcast(podcastId) {
    if (!confirm('Supprimer ce podcast et tous ses fichiers?')) return;

    try {
        const res = await fetch(`/api/podcasts/${podcastId}`, { method: 'DELETE' });
        const data = await res.json();

        if (data.success) {
            loadPodcasts();
        } else {
            alert('Erreur: ' + data.error);
        }
    } catch (error) {
        console.error('Error deleting podcast:', error);
    }
}

async function downloadEpisode(podcastId, episodeId) {
    try {
        const res = await fetch(`/api/podcasts/${podcastId}/episodes/${episodeId}/download`, {
            method: 'POST'
        });
        const data = await res.json();

        if (data.success) {
            alert('Episode téléchargé!');
            loadPodcasts();
        } else {
            alert('Erreur: ' + data.error);
        }
    } catch (error) {
        console.error('Error downloading episode:', error);
    }
}

async function addToPlaylist(podcastId, episodeId) {
    try {
        const res = await fetch('/api/playlist/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ podcast_id: podcastId, episode_id: episodeId })
        });
        const data = await res.json();

        if (data.success) {
            alert('Ajouté à la playlist!');
        } else {
            alert('Erreur: ' + data.error);
        }
    } catch (error) {
        console.error('Error adding to playlist:', error);
    }
}

function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

loadPodcasts();
</script>
{% endblock %}
